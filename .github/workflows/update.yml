name: Update readable styles

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild from upstream
        run: node build.mjs
      - name: Validate the result
        run: node test.mjs
      - name: Commit an upstream update
        run: |
          if git diff --quiet -- styles.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.json
          git commit -m "Update readable styles from upstream"
          git push
